<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ATLAS">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19e3ff"/><stop offset="0.5" stop-color="#7cefff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="acore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eafaff"/><stop offset="0.4" stop-color="#19e3ff"/><stop offset="1" stop-color="#a855f7"/>
    </radialGradient>
    <filter id="agl" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .halo{transform-origin:50px 50px;animation:halo 3.6s ease-in-out infinite}
      @keyframes halo{0%,100%{opacity:.20;transform:scale(1)}50%{opacity:.5;transform:scale(1.12)}}
      .ring{transform-origin:50px 50px}
      .r1{animation:spin 14s linear infinite}
      .r2{animation:spin 9s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .core{transform-origin:50px 50px;animation:pulse 2.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.14);opacity:1}}
      .wave rect{transform-origin:center bottom;animation:eq 1.1s ease-in-out infinite}
      .wave rect:nth-child(1){animation-delay:0s}
      .wave rect:nth-child(2){animation-delay:.15s}
      .wave rect:nth-child(3){animation-delay:.3s}
      .wave rect:nth-child(4){animation-delay:.45s}
      .wave rect:nth-child(5){animation-delay:.6s}
      @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    </style>
  </defs>
  <circle class="halo" cx="50" cy="50" r="32" fill="url(#ag)" opacity="0.26"/>
  <g fill="none" stroke="url(#ag)" filter="url(#agl)">
    <circle class="ring r1" cx="50" cy="50" r="34" stroke-width="2.4" stroke-dasharray="60 26" opacity=".7"/>
    <circle class="ring r2" cx="50" cy="50" r="24" stroke-width="2" stroke-dasharray="30 18" opacity=".8"/>
  </g>
  <circle class="core" cx="50" cy="50" r="13" fill="url(#acore)" filter="url(#agl)"/>
  <g class="wave" fill="#06121a">
    <rect x="42.5" y="45" width="2.4" height="10" rx="1.2"/>
    <rect x="46"   y="43" width="2.4" height="14" rx="1.2"/>
    <rect x="49.3" y="41" width="2.4" height="18" rx="1.2"/>
    <rect x="52.6" y="43" width="2.4" height="14" rx="1.2"/>
    <rect x="56.1" y="45" width="2.4" height="10" rx="1.2"/>
  </g>
  <g filter="url(#agl)" fill="#7cefff">
    <circle r="2.4"><animateMotion dur="9s" repeatCount="indefinite" path="M50 16 A34 34 0 1 1 49.9 16 Z"/></circle>
  </g>
</svg>
